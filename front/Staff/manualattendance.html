<script>
const API_BASE_URL = 'http://localhost:3000/api/v1';

document.addEventListener("DOMContentLoaded", function () {

  const logoutBtn = document.getElementById('logoutBtn');
  const loadBtn = document.querySelector(".load-btn");
  const saveBtn = document.getElementById("saveBtn"); 

  const usernameEl = document.querySelector(".user-name");
  const courseSelect = document.getElementById("courseSelect");
  const typeSelect = document.getElementById("typeSelect")
  const sectionSelect = document.querySelector("select[name='section']");
  const dateInput = document.querySelector("input[type='date']");
  let currentInstructorId = ""; // id instruct
  
  saveBtn.addEventListener("click", saveAttendance);

  let loadedAttendance = [];

  // UserName
  const savedUsername = localStorage.getItem("loggedUser");
  if (savedUsername) {
    usernameEl.textContent = savedUsername;
  }

  // Token
  function getToken() {
    return localStorage.getItem('token');
  }

  function authHeaders() {
    return {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${getToken()}`
    };
  }

  function redirectToLogin() {
    localStorage.clear();
    window.location.href = "./sign in/index.html";
  }

  // Profile
 async function loadProfile() {

  const token = localStorage.getItem("token");

  if (!token) {
    showAlert("Login first", "error");
    window.location.href = "../sign in/index.html";
    return;
  }

  try {

    const res = await fetch("http://localhost:3000/api/v1/auth/profile", {
      headers: {
        "Authorization": `Bearer ${token}`
      }
    });

    const text = await res.text();
    console.log("RAW:", text);

    let result;
    try {
      result = JSON.parse(text);
    } catch {
      throw new Error("Invalid JSON");
    }

    console.log("RESULT:", result);
    const user =
      result.data?.user ||
      result.data ||
      result.user ||
      result;

    console.log("USER:", user);

    const role = user.role || user.userType;

    if (!user || !role) {
      throw new Error("User or role missing");
    }

    document.querySelector(".user-name").textContent =
      user.username || "Staff";
    currentInstructorId = user.id || user.userAccountId || user.userId || "";
    if (role.toLowerCase() !== "staff") {
      showAlert("Staff only", "error");
      localStorage.clear();
      window.location.href = "../sign in/index.html";
    }

  } catch (err) {

    console.error("ERROR:", err);
    showAlert(err.message, "error");

    localStorage.clear();
    window.location.href = "../sign in/index.html";
  }
}

  //Load Courses
  async function loadCourses() {
    try {
      const res = await fetch(`${API_BASE_URL}/courses`, {
        headers: authHeaders()
      });

      const data = await res.json();
      if (!res.ok) throw new Error();

      const courses = data.data || data;

      courseSelect.innerHTML = `<option value="">Select Course</option>`;

     courses.forEach(c => {
  courseSelect.innerHTML += `
   <option value="${c.courseId || c.id}">
      ${c.name || c.title}
    </option>
  `;
});

    } catch (err) {
      console.error("Courses error:", err);
    }
  }

  // Load Sections
async function loadSections(courseId) {
  try {
    const res = await fetch(`${API_BASE_URL}/courses/${courseId}`, {
      headers: authHeaders()
    });

    const data = await res.json();
    const course = data.data || data;

    const totalSections = course.sections || 0;

    sectionSelect.innerHTML = `<option value="">Select Section</option>`;

    for (let i = 1; i <= totalSections; i++) {
      sectionSelect.innerHTML += `
        <option value="${i}">Section ${i}</option>
      `;
    }

  } catch (err) {
    console.error("Sections error:", err);
  }
}
  // LOAD STUDENTS
  async function loadStudents(courseId) {
    try {
      const res = await fetch(`${API_BASE_URL}/courses/${courseId}/students`, {
        headers: authHeaders()
      });

      const data = await res.json();
      if (!res.ok) throw new Error();

      return data.data || [];

    } catch (err) {
      console.error("Students error:", err);
      return [];
    }
  }

  // Render 
  function renderAttendanceRows(students) {
  tbody.innerHTML = "";

  if (!students.length) {
    tbody.innerHTML = `<tr><td colspan="5">No data</td></tr>`;
    return;
  }

  students.forEach(s => {
    const row = document.createElement("tr");

    row.setAttribute("data-record-id", s.recordId || "");
    row.innerHTML = `
   <td>${s.studentId}</td>
   <td>${s.name}</td>
   <td>${s.status}</td>
   <td>${s.time}</td>
   <td>
     <select class="manual-input status-dropdown-selector">
      <option value="Present" ${s.status === "Present" ? "selected" : ""}>Present</option>
      <option value="Absent" ${s.status === "Absent" ? "selected" : ""}>Absent</option>
      <option value="Late" ${s.status === "Late" ? "selected" : ""}>Late</option>
     </select>
    </td>
    `;

     tbody.appendChild(row);
     });
      }


function renderModal() {

  modalTbody.innerHTML = "";

  if (!loadedAttendance.length) {
    modalTbody.innerHTML = `
      <tr>
        <td colspan="5" style="text-align:center">No data</td>
      </tr>
    `;
    return;
  }

  loadedAttendance.forEach(s => {

    const row = document.createElement("tr");
    
    row.setAttribute("data-record-id", s.recordId);
    row.setAttribute("data-student-id", s.studentId || ""); 
    row.setAttribute("data-initial-status", s.status); 
    row.innerHTML = `
      <td>${s.studentId}</td>
      <td>${s.name}</td>
      <td>${s.status}</td>
      <td>${s.time}</td>
      <td>
        <select class="manual-input status-dropdown-selector">
          <option value="Present" ${s.status === "Present" ? "selected" : ""}>Present</option>
          <option value="Absent" ${s.status === "Absent" ? "selected" : ""}>Absent</option>
          <option value="Late" ${s.status === "Late" ? "selected" : ""}>Late</option>
        </select>
      </td>
    `;

    modalTbody.appendChild(row);
  });
}
  // LOAD ATTENDANCE 
const modal = new bootstrap.Modal(document.getElementById('attendanceModal'));
const modalTbody = document.getElementById("modalTbody");
const tbody = modalTbody; 
function showAlert(message, type = "success") {
  Swal.fire({
    text: message,
    icon: type, // success | error | warning | info
    background: "#1a1a3a",
    color: "#fff",
    confirmButtonColor: "#3060ff",
    confirmButtonText: "OK",
    showClass: {
      popup: "animate__animated animate__zoomIn"
    },
    hideClass: {
      popup: "animate__animated animate__fadeOut"
    }
  });
}

async function loadAttendance() {

if (!courseSelect.value || !sectionSelect.value || !dateInput.value) {
  showNoData("Please select all fields");
  return;
}

try {

const studentRes = await fetch(`${API_BASE_URL}/courses/${courseSelect.value}/students`, { headers: authHeaders() });
const studentData = await studentRes.json();
const completeRoster = studentData.data || studentData || [];
//Fetch today
const url = `${API_BASE_URL}/attendance?page=1&limit=100&courseId=${courseSelect.value}&sessionNumber=${sectionSelect.value}&date=${dateInput.value}`;
const logRes = await fetch(url, { headers: authHeaders() });
let loggedRecords = logRes.ok ? (await logRes.json())?.data?.data || [] : [];

loadedAttendance = completeRoster.map(student => {
  const rosterStudentId = student.userAccountId || student.id || student.studentId;
  const rosterStudentName = student.username || student.fullName || student.name || "Enrolled Student";

  //if this student has a log for today
  const matchedLog = loggedRecords.find(log => String(log.student?.userAccountId || log.studentId) === String(rosterStudentId));

  if (matchedLog) {
    return {
      recordId: matchedLog.recordId || "",
      studentId: rosterStudentId,
      name: rosterStudentName,
      status: matchedLog.attendanceStatusId == 1 ? "Present" : matchedLog.attendanceStatusId == 2 ? "Absent" : "Late",
      time: matchedLog.checkInTime ? matchedLog.checkInTime.substring(0, 5) : "--"
    };
  } else {
    return { recordId: "", studentId: rosterStudentId, name: rosterStudentName, status: "Absent", time: "--" };
  }
});

renderModal();
modal.show();

}
catch(err){
console.error(err);
showNoData("Failed to load data");
}
}

function showNoData(message){

modalTbody.innerHTML = `
<tr>
  <td colspan="5" style="text-align:center; padding:30px; color:#aaa;">
    <i class="bi bi-exclamation-circle" style="font-size:22px;"></i><br>
    ${message}
  </td>
</tr>
`;

modal.show();
}

 async function saveAttendance() {
  const rows = tbody.querySelectorAll("tr");
  if (!rows.length) return;

  saveBtn.disabled = true;

  const currentCourseId = courseSelect.value;
  const currentSessionNumber = String(sectionSelect.value);
  const currentSessionType = String(typeSelect.value).toUpperCase() || "SECTION";
  const currentSelectedDate = dateInput.value;
const currentLocalTime = new Date().toTimeString().substring(0, 5);
  try {
    let createdRecordsCount = 0;
    let updatedRecordsCount = 0;
    let skippedUnchangedCount = 0;
    for (let row of rows) {
      const recordId = row.getAttribute("data-record-id");
      const studentId = row.getAttribute("data-student-id");
      const initialStatus = row.getAttribute("data-initial-status"); //
      const statusText = row.querySelector(".status-dropdown-selector").value;
      if (recordId && initialStatus === statusText) {
        skippedUnchangedCount++;
        continue;
      }
      let attendanceStatusId =
        statusText === "Present" ? 1 :
        statusText === "Absent" ? 2 :   
        statusText === "Late" ? 3 : 1; 

      const payload = {
        studentId: studentId,
        courseId: currentCourseId,
        attendanceStatusId: attendanceStatusId,
        recordDate: currentSelectedDate,
        sessionType: currentSessionType,
        sessionNumber: currentSessionNumber,
        markedBy: currentInstructorId, 
        checkInTime: currentLocalTime
      };

      // Get Data
     let targetUrl = `${API_BASE_URL}/attendance`;
      let protocolMethod = "POST"; 

       if (recordId && recordId.trim() !== "" && recordId !== "undefined") {
          targetUrl = `${API_BASE_URL}/attendance/${recordId}`;
          protocolMethod = "PUT"; 
          
          delete payload.studentId;
          delete payload.courseId;
          delete payload.markedBy;
       }
       const res = await fetch(targetUrl, {
        method: protocolMethod,
        headers: authHeaders(),
        body: JSON.stringify(payload)
        });
      if (!res.ok) {
        const errorLog = await res.json();
        throw new Error(errorLog.message || "Failed processing attendance collection items.");
      }

      if (protocolMethod === "POST") {
        createdRecordsCount++;
      } else {
        updatedRecordsCount++;
      }
    }

    showAlert(`Attendance process completed!\n• Saved: ${createdRecordsCount} new logs.\n• Updated: ${updatedRecordsCount} modifications.\n• Skipped: ${skippedUnchangedCount} unchanged rows.`, "success");
    modal.hide();

    } catch (err) {
    console.error("Attendance synchronization processing failed:", err);
    showAlert(err.message || "Unable to fully capture and log administrative record lists.", "error");
    } finally {
    saveBtn.disabled = false;
    }
   }

  // Events
  courseSelect.addEventListener("change", () => {
    if (courseSelect.value) {
      loadSections(courseSelect.value);
    }
  });

  loadBtn.addEventListener("click", loadAttendance);

  logoutBtn.addEventListener("click", () => {
  Swal.fire({
        text: "Logged out successfully",
        icon: "success",
        background: "#1a1a3a",
        color: "#fff",
        confirmButtonColor: "#3060ff",
        confirmButtonText: "OK"
    }).then(() => {
