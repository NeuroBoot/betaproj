<script>
const API_BASE_URL = 'http://localhost:3000/api/v1';

document.addEventListener("DOMContentLoaded", function () {

  const logoutBtn = document.getElementById('logoutBtn');
  const loadBtn = document.querySelector(".load-btn");
  const saveBtn = document.getElementById("saveBtn"); 

  const usernameEl = document.querySelector(".user-name");
  const courseSelect = document.getElementById("courseSelect");
  const sectionSelect = document.querySelector("select[name='section']");
  const dateInput = document.querySelector("input[type='date']");

  
  saveBtn.addEventListener("click", saveAttendance);

  let loadedAttendance = [];

  // ================= USERNAME FROM LOGIN =================
  const savedUsername = localStorage.getItem("loggedUser");
  if (savedUsername) {
    usernameEl.textContent = savedUsername;
  }

  // ================= TOKEN =================
  function getToken() {
    return localStorage.getItem('token');
  }

  function authHeaders() {
    return {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${getToken()}`
    };
  }

  function redirectToLogin() {
    localStorage.clear();
    window.location.href = "../sign-in/index.html";
  }

  // ================= PROFILE (Fallback + Auth Check) =================
 async function loadProfile() {

  const token = localStorage.getItem("token");

  if (!token) {
    showAlert("Login first", "error");
    window.location.href = "../sign-in/index.html";
    return;
  }

  try {

    const res = await fetch("http://localhost:3000/api/v1/auth/profile", {
      headers: {
        "Authorization": `Bearer ${token}`
      }
    });

    const text = await res.text();
    console.log("RAW:", text);

    let result;
    try {
      result = JSON.parse(text);
    } catch {
      throw new Error("Invalid JSON");
    }

    console.log("RESULT:", result);

    // 🔥 مرن جدًا
    const user =
      result.data?.user ||
      result.data ||
      result.user ||
      result;

    console.log("USER:", user);

    const role = user.role || user.userType;

    if (!user || !role) {
      throw new Error("User or role missing");
    }

    document.querySelector(".user-name").textContent =
      user.username || "Staff";

    if (role.toLowerCase() !== "staff") {
      showAlert("Staff only", "error");
      localStorage.clear();
      window.location.href = "../sign-in/index.html";
    }

  } catch (err) {

    console.error("ERROR:", err);
    showAlert(err.message, "error");

    localStorage.clear();
    window.location.href = "../sign-in/index.html";
  }
}

  // ================= LOAD COURSES =================
  async function loadCourses() {
    try {
      const res = await fetch(`${API_BASE_URL}/courses`, {
        headers: authHeaders()
      });

      const data = await res.json();
      if (!res.ok) throw new Error();

      const courses = data.data || data;

      courseSelect.innerHTML = `<option value="">Select Course</option>`;

     courses.forEach(c => {
  courseSelect.innerHTML += `
   <option value="${c.courseId || c.id}">
      ${c.name || c.title}
    </option>
  `;
});

    } catch (err) {
      console.error("Courses error:", err);
    }
  }

  // ================= LOAD SECTIONS =================
async function loadSections(courseId) {

  const type = document.getElementById("typeSelect").value;

  try {
    const res = await fetch(`${API_BASE_URL}/courses/${courseId}`, {
      headers: authHeaders()
    });

    const data = await res.json();
    const course = data.data || data;

    sectionSelect.innerHTML = `<option value="">Select Option</option>`;

    if (!type) return;

    if (type.toLowerCase() === "section") {

      const sections = course.data?.sections || [];

      sections.forEach(sec => {
        const option = document.createElement("option");
        option.value = sec;
        option.textContent = isNaN(sec) ? sec : `Section ${sec}`;
        sectionSelect.appendChild(option);
      });

    } else if (type.toLowerCase() === "lecture") {

      let lectures = course.data?.lectures || [];

      if (lectures.length === 0) {
        lectures = ["A", "B", "C", "D"];
      }

      lectures.forEach(lec => {
        const option = document.createElement("option");
        option.value = lec;
        option.textContent = `Group ${lec}`;
        sectionSelect.appendChild(option);
      });
    }

  } catch (err) {
    console.error("Sections error:", err);
  }
}

  // ================= LOAD STUDENTS =================
  async function loadStudents(courseId) {
    try {
      const res = await fetch(`${API_BASE_URL}/courses/${courseId}/students`, {
        headers: authHeaders()
      });

      const data = await res.json();
      if (!res.ok) throw new Error();

      return data.data || [];

    } catch (err) {
      console.error("Students error:", err);
      return [];
    }
  }

  // ================= RENDER =================
  function renderAttendanceRows(students) {
  tbody.innerHTML = "";

  if (!students.length) {
    tbody.innerHTML = `<tr><td colspan="5">No data</td></tr>`;
    return;
  }

  students.forEach(s => {
    const row = document.createElement("tr");

    row.setAttribute("data-record-id", s.recordId || ""); // 🔥 مهم

    row.innerHTML = `
      <td>${s.studentId}</td>
      <td>${s.name}</td>
      <td><span class="status">${s.status}</span></td>
      <td>${s.time}</td>
      <td>
        <select class="manual-input status-select" style="width: auto; display: inline-block;">
          <option ${s.status === "Present" ? "selected" : ""}>Present</option>
          <option ${s.status === "Absent" ? "selected" : ""}>Absent</option>
          <option ${s.status === "Late" ? "selected" : ""}>Late</option>
        </select>
        <button class="btn btn-sm btn-outline-info ms-2" onclick="openAIVerifyModal('${s.studentId}', this)">
            <i class="bi bi-camera"></i> AI Verify
        </button>
      </td>
    `;

    tbody.appendChild(row);
  });
}
//rendalmodel
function renderModal() {

  modalTbody.innerHTML = "";

  if (!loadedAttendance.length) {
    modalTbody.innerHTML = `
      <tr>
        <td colspan="5" style="text-align:center">No data</td>
      </tr>
    `;
    return;
  }

  loadedAttendance.forEach(s => {

    const row = document.createElement("tr");

    row.setAttribute("data-record-id", s.recordId);

    row.innerHTML = `
      <td>${s.studentId}</td>
      <td>${s.name}</td>
      <td>${s.status}</td>
      <td>${s.time}</td>
      <td>
        <select class="manual-input" style="width: auto; display: inline-block;">
          <option ${s.status === "Present" ? "selected" : ""}>Present</option>
          <option ${s.status === "Absent" ? "selected" : ""}>Absent</option>
          <option ${s.status === "Late" ? "selected" : ""}>Late</option>
        </select>
        <button class="btn btn-sm btn-outline-info ms-2" onclick="openAIVerifyModal('${s.studentId}', this)">
            <i class="bi bi-camera"></i> AI Verify
        </button>
      </td>
    `;

    modalTbody.appendChild(row);
  });
}
  // ================= LOAD ATTENDANCE =================
const modal = new bootstrap.Modal(document.getElementById('attendanceModal'));
const modalTbody = document.getElementById("modalTbody");
const tbody = modalTbody; 
//alert
function showAlert(message, type = "success") {
  Swal.fire({
    text: message,
    icon: type, // success | error | warning | info
    background: "#1a1a3a",
    color: "#fff",
    confirmButtonColor: "#3060ff",
    confirmButtonText: "OK",
    showClass: {
      popup: "animate__animated animate__zoomIn"
    },
    hideClass: {
      popup: "animate__animated animate__fadeOut"
    }
  });
}

async function loadAttendance() {

if (!courseSelect.value || !sectionSelect.value || !dateInput.value) {
  showNoData("Please select all fields");
  return;
}

try {

const url =
`${API_BASE_URL}/attendance?page=1&limit=100` +
`&courseId=${courseSelect.value}` +
`&section=${sectionSelect.value}` +
`&date=${dateInput.value}`;

const res = await fetch(url,{ headers: authHeaders() });

if (!res.ok) throw new Error("Server error");

const data = await res.json();
const attendance = data?.data?.data || [];

if(attendance.length === 0){
  showNoData("No attendance records found");
  return;
}

loadedAttendance = attendance.map(a => ({
recordId: a.recordId,
studentId: a.student?.userAccountId || a.studentId,
name: a.student?.username || "Student",
status: a.attendanceStatusId == 1 ? "Present"
      : a.attendanceStatusId == 2 ? "Absent"
      : a.attendanceStatusId == 3 ? "Late"
      : "Unknown",
time: a.checkInTime
? new Date(a.checkInTime).toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
})
: "--"
}));

renderModal();
modal.show();

}
catch(err){
console.error(err);

/* 🔥 أي error يفتح popup ويعرض No Data */
showNoData("Failed to load data");
}
}
//=================show No Data in Modal=================
function showNoData(message){

modalTbody.innerHTML = `
<tr>
  <td colspan="5" style="text-align:center; padding:30px; color:#aaa;">
    <i class="bi bi-exclamation-circle" style="font-size:22px;"></i><br>
    ${message}
  </td>
</tr>
`;

modal.show();
}
  // ================= SAVE =================
 async function saveAttendance() {

  const rows = tbody.querySelectorAll("tr");

  saveBtn.disabled = true;

  try {

    for (let row of rows) {

      const recordId = row.getAttribute("data-record-id");

      if (!recordId) continue; // 🔥 مفيش record → سيبه

      const statusText = row.querySelector("select").value;

let attendanceStatusId =
  statusText === "Present" ? 1 :
  statusText === "Absent" ? 2 :
  statusText === "Late" ? 3 : 1;

await fetch(`${API_BASE_URL}/attendance/${recordId}`, {
  method: "PUT",
  headers: authHeaders(),
  body: JSON.stringify({
    attendanceStatusId
  })
});
    }

    showAlert("Updated successfully", "success");

  } catch (err) {
    console.error("Save error:", err);
    showAlert("Update failed", "error");
  } finally {
    saveBtn.disabled = false;
  }
}
  // ================= EVENTS =================
  courseSelect.addEventListener("change", () => {
    if (courseSelect.value) {
      loadSections(courseSelect.value);
    }
  });

  document.getElementById("typeSelect").addEventListener("change", () => {
    if (courseSelect.value) {
      loadSections(courseSelect.value);
    }
  });

  loadBtn.addEventListener("click", loadAttendance);


 

 

  logoutBtn.addEventListener("click", () => {
  Swal.fire({
        text: "Logged out successfully",
        icon: "success",
        background: "#1a1a3a",
        color: "#fff",
        confirmButtonColor: "#3060ff",
        confirmButtonText: "OK"
    }).then(() => {
        window.location.href = "../sign-in/index.html";
    });
  });

  // ================= INIT =================
  loadProfile();
  loadCourses();

});
</script>

      <div class="modal-header border-0">
        <h5 class="modal-title">AI Face Verification</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <p class="text-muted">Verifying student ID: <span id="verifyStudentId"></span></p>
        <div style="position:relative; width: 100%; max-width: 400px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 2px dashed rgba(255,255,255,0.2);">
            <video id="verifyVideo" autoplay playsinline style="width: 100%; display: none;"></video>
            <div id="verifyPlaceholder" style="padding: 40px 0;">
                <i class="bi bi-camera fs-1 mb-2"></i>
                <p>Camera ready</p>
            </div>
        </div>
        <canvas id="verifyCanvas" style="display:none;"></canvas>
      </div>
      <div class="modal-footer border-0 justify-content-center">
        <button class="btn btn-primary px-4" id="startVerifyCameraBtn">Start Camera</button>
        <button class="btn btn-success px-4" id="captureVerifyBtn" style="display: none;">Verify Face</button>
      </div>
    </div>
  </div>
</div>

<script>
let verifyStream = null;
let currentVerifyStudentId = null;
let currentVerifySelectElement = null;

function openAIVerifyModal(studentId, btnElement) {
    currentVerifyStudentId = studentId;
    // Find the select element next to this button
    currentVerifySelectElement = btnElement.previousElementSibling;
    document.getElementById('verifyStudentId').textContent = studentId;
    const aiModal = new bootstrap.Modal(document.getElementById('aiVerifyModal'));
    aiModal.show();
}

document.getElementById('aiVerifyModal').addEventListener('hidden.bs.modal', function () {
    if (verifyStream) {
        verifyStream.getTracks().forEach(track => track.stop());
        verifyStream = null;
    }
    document.getElementById('verifyVideo').style.display = 'none';
    document.getElementById('verifyPlaceholder').style.display = 'block';
    document.getElementById('startVerifyCameraBtn').style.display = 'inline-block';
    document.getElementById('captureVerifyBtn').style.display = 'none';
});

document.getElementById('startVerifyCameraBtn').addEventListener('click', async () => {
    try {
        verifyStream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.getElementById('verifyVideo');
        video.srcObject = verifyStream;
        video.style.display = 'block';
        document.getElementById('verifyPlaceholder').style.display = 'none';
        document.getElementById('startVerifyCameraBtn').style.display = 'none';
        document.getElementById('captureVerifyBtn').style.display = 'inline-block';
    } catch (err) {
        showAlert("Camera access denied!", "error");
    }
});

document.getElementById('captureVerifyBtn').addEventListener('click', async () => {
    const video = document.getElementById('verifyVideo');
    const canvas = document.getElementById('verifyCanvas');
    if (!video.videoWidth) return;
    
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    const base64Data = canvas.toDataURL('image/jpeg');
    
    // Stop camera
    if (verifyStream) {
        verifyStream.getTracks().forEach(track => track.stop());
        verifyStream = null;
    }
    video.style.display = 'none';
    document.getElementById('captureVerifyBtn').disabled = true;
    document.getElementById('captureVerifyBtn').textContent = 'Processing...';

    try {
        const payload = {
            imageBase64: base64Data,
            confidenceThreshold: 0.65,
            // Fix: Add missing fields required by ProcessFrameDto
            courseId: Number(courseId),
            sectionId: sectionId || '1',
            sessionId: `VERIFY_${Date.now()}`,
            sessionType: 'SECTION',
            sessionNumber: '1'
        };

        const res = await fetch(`${API_BASE_URL}/vision/recognize`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${localStorage.getItem('token')}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        
        const isMatched = data.matched === true || data.status === 'RECORDED' || data.status === 'ALREADY_RECORDED';
        const confidence = data.confidence ?? data.student?.confidence ?? data.confidenceScore ?? 0;
        const confidencePercent = (confidence * 100).toFixed(1);

        if (res.ok && isMatched) {
            // Check if the recognized student matches the row we clicked
            const recognizedStudentId = String(data.studentId || data.student?.id || data.student?.userAccountId);
            if (recognizedStudentId === String(currentVerifyStudentId)) {
                showAlert(`Verification Successful! Student matched. (${confidencePercent}%)`, "success");
                if (currentVerifySelectElement) {
                    currentVerifySelectElement.value = "Present";
                }
                bootstrap.Modal.getInstance(document.getElementById('aiVerifyModal')).hide();
            } else {
                showAlert(`Face recognized as ${data.student ? data.student.username : (data.studentId || recognizedStudentId)}, not the selected student. (${confidencePercent}%)`, "error");
            }
        } else {
            showAlert(data.message || `No match found or face not recognized clearly. (${confidencePercent}%)`, "error");
        }
    } catch (err) {
        showAlert("Verification failed due to server error.", "error");
    } finally {
        document.getElementById('captureVerifyBtn').disabled = false;
        document.getElementById('captureVerifyBtn').textContent = 'Verify Face';
    }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
