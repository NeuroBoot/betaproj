<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FaceMark | Student Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body { background: #0f0c29; color: #ffffff; min-height: 100vh; font-family: "Segoe UI", sans-serif; display: flex; margin: 0; }
.sidebar { width: 240px; background: #15132b; min-height: 100vh; padding: 20px; flex-shrink: 0; }
.user-box { background: #1a1a3a; border-radius: 14px; padding: 14px; margin: 18px 0 24px; }
.user-box small { color: #b0b0b0; font-size: 13px; }
.user-name { font-size: 16px; font-weight: 600; color: #ffffff; }
.sidebar .nav-link { color: #b0b0b0; margin-bottom: 10px; border-radius: 10px; padding: 10px 14px; text-decoration: none; display: block; transition: 0.2s; }
.sidebar .nav-link.active, .sidebar .nav-link:hover { background: #3060ff; color: #ffffff; }
.main-wrapper { flex: 1; margin: 16px; background: #1a1a3a; border-radius: 24px; padding: 24px; border: 1px solid rgba(255,255,255,0.05); overflow-y: auto; }
.stats-card { border-radius: 18px; padding: 20px; margin-bottom: 20px; }
.card-attendance { background: rgba(48,96,255,0.2); border-left: 4px solid #3060ff; }
.card-classes { background: rgba(46,204,112,0.2); border-left: 4px solid #2ecc71; }
.card-courses { background: rgba(156,89,182,0.2); border-left: 4px solid #9b59b6; }
.stats-title { color: #b0b0b0; font-size: 14px; }
.stats-value { font-size: 28px; font-weight: 700; }
.today-schedule { background: rgba(255,255,255,0.02); border-radius: 20px; padding: 22px; margin-bottom: 24px; }
.schedule-row { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; position: relative; }
.schedule-row::before { content: ""; position: absolute; left: 0; top: 0; width: 6px; height: 100%; border-radius: 14px 0 0 14px; background: #3060ff; }
.history-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
.history-table th, .history-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: left; }
.history-status { padding: 4px 12px; border-radius: 12px; font-size: 12px; }
.history-present { background: rgba(46,204,112,0.15); color: #2ecc71; }
.history-absent { background: rgba(231,76,60,0.15); color: #e74c3c; }
</style>
</head>
<body>

<div class="sidebar">
  <h5 class="mb-4"><img src="face.jpeg" alt="" width="40"> FACEMARK</h5>
  <div class="user-box">
    <small>Welcome,</small>
    <div class="user-name" id="username">Loading...</div>
  </div>
  <ul class="nav flex-column">
    <li><a class="nav-link active" href="#"><i class="bi bi-grid"></i> Dashboard</a></li>
    <li><a class="nav-link" href="javascript:void(0)" onclick="triggerManualReg()"><i class="bi bi-camera"></i> Register Face</a></li>
    <li><a class="nav-link" href="viewcourse.html"><i class="fa-solid fa-book"></i> Courses</a></li>
    <li><a class="nav-link" href="alertstudent.html"><i class="bi bi-bell"></i> Alerts</a></li>
  </ul>
  <hr class="text-secondary">
  <button id="logoutBtn" class="btn btn-outline-danger w-100 mt-2">Sign Out</button>
</div>

<div class="main-wrapper">
  <div class="row">
    <div class="col-md-4"><div class="stats-card card-attendance"><div class="stats-title">Attendance</div><div class="stats-value" id="overallAttendance">0%</div></div></div>
    <div class="col-md-4"><div class="stats-card card-classes"><div class="stats-title">Classes</div><div class="stats-value" id="classesAttended">0/0</div></div></div>
    <div class="col-md-4"><div class="stats-card card-courses"><div class="stats-title">Courses</div><div class="stats-value" id="totalCourses">0</div></div></div>
  </div>

  <div class="today-schedule">
    <h5>Today's Schedule</h5>
    <div id="todaySchedule"></div>
  </div>

  <div class="attendance-history">
    <h5>Recent History</h5>
    <table class="history-table">
      <thead><tr><th>Date</th><th>Course</th><th>Time</th><th>Status</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="faceRegistrationModal" data-bs-backdrop="static" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:#1a1a3a; color:#fff; border-radius:20px; border: 1px solid #3060ff;">
      <div class="modal-header border-0"><h5 class="modal-title">Face Registration Required</h5></div>
      <div class="modal-body text-center">
        <p class="small text-muted">Register your face for the AI system (3 clear images needed).</p>
        <div style="background:#000; border-radius:12px; overflow:hidden; min-height:240px; display:flex; align-items:center; justify-content:center;">
          <video id="regVideo" autoplay playsinline style="width:100%; display:none;"></video>
          <div id="regPlaceholder"><i class="bi bi-camera fs-1"></i></div>
        </div>
        <p id="regStatusText" class="mt-3 text-info">Captured: 0 / 3</p>
        <canvas id="regCanvas" style="display:none;"></canvas>
      </div>
      <div class="modal-footer border-0 justify-content-center">
        <button class="btn btn-primary" id="startRegCameraBtn">Start Camera</button>
        <button class="btn btn-success" id="captureRegBtn" style="display:none;">Capture Shot</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
const API_BASE_URL = 'http://localhost:3000/api/v1';
let regStream = null, capturedImages = [], regModal = null, userData = null;

const getToken = () => localStorage.getItem('token');
const headers = () => ({ 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' });

async function loadProfile() {
    try {
        const res = await fetch(`${API_BASE_URL}/auth/profile`, { headers: headers() });
        const json = await res.json();
        userData = json.data;
        document.getElementById('username').textContent = userData.username;
        
        // Auto-show popup if no face
        if (!userData.faceEmbedding || userData.faceEmbedding === "null") {
            setTimeout(() => {
                regModal = new bootstrap.Modal(document.getElementById('faceRegistrationModal'));
                regModal.show();
            }, 1000);
        }
    } catch (e) { window.location.href = '../sign-in/index.html'; }
}

async function loadData() {
    try {
        const [statsRes, coursesRes, attendRes] = await Promise.all([
            fetch(`${API_BASE_URL}/attendance/statistics`, { headers: headers() }),
            fetch(`${API_BASE_URL}/courses`, { headers: headers() }),
            fetch(`${API_BASE_URL}/attendance`, { headers: headers() })
        ]);
        
        const stats = (await statsRes.json()).data;
        const courses = (await coursesRes.json()).data;
        const attend = (await attendRes.json()).data?.data || [];

        if (stats?.metrics) document.getElementById('overallAttendance').textContent = stats.metrics.avg;
        document.getElementById('totalCourses').textContent = courses.length;

        const schedDiv = document.getElementById('todaySchedule');
        schedDiv.innerHTML = courses.map(c => `
            <div class="schedule-row">
                <div><strong>${c.name}</strong><br><small>${c.instructor?.fullName || 'Instructor'}</small></div>
                <div class="text-end"><small>${c.schedule || 'N/A'}</small></div>
            </div>`).join('') || '<p>No classes today</p>';

        const histBody = document.getElementById('historyBody');
        histBody.innerHTML = attend.slice(0, 5).map(r => `
            <tr>
                <td>${new Date(r.recordDate).toLocaleDateString()}</td>
                <td>${r.course?.name || 'Course'}</td>
                <td>${r.checkInTime ? new Date(r.checkInTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '-'}</td>
                <td><span class="history-status ${r.attendanceStatusId == 1 ? 'history-present' : 'history-absent'}">${r.attendanceStatusId == 1 ? 'Present' : 'Absent'}</span></td>
            </tr>`).join('') || '<tr><td colspan="4">No records</td></tr>';
    } catch (e) { console.error(e); }
}

window.triggerManualReg = () => {
    if (!regModal) regModal = new bootstrap.Modal(document.getElementById('faceRegistrationModal'));
    regModal.show();
};

document.getElementById('startRegCameraBtn').onclick = async () => {
    try {
        regStream = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById('regVideo').srcObject = regStream;
        document.getElementById('regVideo').style.display = 'block';
        document.getElementById('regPlaceholder').style.display = 'none';
        document.getElementById('startRegCameraBtn').style.display = 'none';
        document.getElementById('captureRegBtn').style.display = 'inline-block';
    } catch (e) { alert("Camera failed"); }
};

document.getElementById('captureRegBtn').onclick = () => {
    const video = document.getElementById('regVideo');
    const canvas = document.getElementById('regCanvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    capturedImages.push(canvas.toDataURL('image/jpeg'));
    document.getElementById('regStatusText').textContent = `Captured: ${capturedImages.length} / 3`;

    if (capturedImages.length >= 3) {
        document.getElementById('captureRegBtn').disabled = true;
        fetch(`${API_BASE_URL}/vision/upload`, {
            method: 'POST',
            headers: headers(),
            body: JSON.stringify({
                students: [{ imagesBase64: capturedImages, studentId: String(userData.userAccountId), name: userData.username }]
            })
        }).then(res => res.json()).then(res => {
            const result = Array.isArray(res) ? res[0] : res;
            if (result.success || res.success) {
                Swal.fire("Success!", "Face registered", "success").then(() => location.reload());
            } else alert("Upload failed");
        }).catch(() => alert("Error saving face"));
    }
};

document.getElementById('logoutBtn').onclick = () => { localStorage.clear(); window.location.href = '../sign-in/index.html'; };

document.addEventListener('DOMContentLoaded', () => { loadProfile(); loadData(); });
</script>
</body>
</html>
